<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOSS III · 精準行銷引擎｜整合儀表板</title>
<style>
:root{
  --bg:#05070d;
  --bg2:#080b16;
  --panel:#0d1424cc;
  --panel-solid:#0e1526;
  --panel2:#121b30;
  --border:rgba(122,162,255,0.16);
  --border-soft:rgba(122,162,255,0.08);
  --accent:#4f8cff;
  --accent-bright:#7fd4ff;
  --gold:#f5b942;
  --red:#ff6b6b;
  --gray:#8a93ab;
  --green:#34d399;
  --text:#eef2ff;
  --text-dim:#9aa4c4;
  --text-faint:#5c6584;
  --radius:14px;
  --font-display:'Microsoft JhengHei','Segoe UI','PingFang TC','Noto Sans TC',sans-serif;
  --font-body:'Microsoft JhengHei','PingFang TC','Noto Sans TC','Segoe UI',sans-serif;
  --font-mono:'Consolas','Cascadia Mono','Courier New',monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none;}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(79,140,255,0.16), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(127,212,255,0.10), transparent 60%),
    radial-gradient(ellipse 800px 600px at 50% 110%, rgba(79,140,255,0.10), transparent 60%);
}

/* ---------- nav ---------- */
header{
  position:sticky; top:0; z-index:50;
  backdrop-filter: blur(14px);
  background:rgba(5,7,13,0.82);
  border-bottom:1px solid var(--border-soft);
}
.nav-wrap{
  max-width:1280px; margin:0 auto; padding:0 20px;
  display:flex; align-items:center; justify-content:space-between;
  height:64px;
}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent-bright));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display); font-weight:700; color:#04070f; font-size:15px;
  box-shadow:0 0 22px rgba(79,140,255,0.55);
}
.brand-text .t1{font-family:var(--font-display); font-weight:700; font-size:16.5px; letter-spacing:0.5px; color:var(--text);}
.brand-text .t2{font-size:10.5px; color:var(--text-faint); letter-spacing:1.5px; font-family:var(--font-display); text-transform:uppercase;}

nav.tabs{display:flex; gap:2px;}
nav.tabs button{
  appearance:none; border:none; background:transparent; color:var(--text-dim);
  font-family:var(--font-body); font-weight:500; font-size:14px;
  padding:10px 14px; border-radius:8px; cursor:pointer; letter-spacing:0.3px;
  transition:all .18s ease; white-space:nowrap;
}
nav.tabs button:hover{color:var(--text); background:var(--border-soft);}
nav.tabs button.active{color:var(--bg); background:linear-gradient(135deg,var(--accent),var(--accent-bright)); box-shadow:0 0 18px rgba(79,140,255,.4);}
.nav-toggle{display:none; background:none; border:1px solid var(--border); border-radius:8px; color:var(--text); width:38px; height:38px; cursor:pointer; font-size:18px;}

@media (max-width:980px){
  nav.tabs{
    display:none; position:absolute; top:64px; left:0; right:0;
    flex-direction:column; background:rgba(5,7,13,0.97); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border); padding:8px; gap:4px;
  }
  nav.tabs.open{display:flex;}
  .nav-toggle{display:block;}
}

/* ---------- layout ---------- */
main{position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:28px 20px 80px;}
section.page{display:none; animation:fadeIn .35s ease;}
section.page.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.eyebrow{
  font-family:var(--font-display); font-weight:600; font-size:12px; letter-spacing:3px;
  color:var(--accent-bright); text-transform:uppercase; margin:0 0 8px;
}
h1.page-title{font-size:clamp(24px,3.4vw,34px); font-weight:900; margin:0 0 6px; letter-spacing:.3px;}
p.page-sub{color:var(--text-dim); margin:0 0 26px; font-size:14.5px;}

.panel{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:22px 24px; backdrop-filter:blur(6px);
}
.panel + .panel{margin-top:18px;}
.panel h2{font-size:17px; margin:0 0 4px; font-weight:700;}
.panel h2 .n{color:var(--accent-bright); font-family:var(--font-display); font-weight:700; margin-right:6px;}
.panel .desc{color:var(--text-dim); font-size:13px; margin:0 0 16px;}

.grid{display:grid; gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-5{grid-template-columns:repeat(5,1fr);}
@media (max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4,.grid.cols-5{grid-template-columns:1fr 1fr;}}
@media (max-width:600px){.grid.cols-2,.grid.cols-3,.grid.cols-4,.grid.cols-5{grid-template-columns:1fr;}}

.kpi-card{
  background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:16px 18px;
  position:relative; overflow:hidden;
}
.kpi-card .label{font-size:12px; color:var(--text-dim); margin-bottom:8px; letter-spacing:.3px;}
.kpi-card .value{font-family:var(--font-display); font-size:28px; font-weight:700; color:var(--text);}
.kpi-card .delta{font-size:12px; margin-top:6px; color:var(--text-faint);}
.kpi-card .delta.warn{color:var(--gold);}
.kpi-card .delta.danger{color:var(--red);}
.kpi-card .delta.good{color:var(--green);}
.kpi-card.accent{border-color:rgba(79,140,255,0.4);}
.kpi-card .glow{position:absolute; top:-30px; right:-30px; width:90px; height:90px; border-radius:50%; background:radial-gradient(circle,rgba(79,140,255,.25),transparent 70%); pointer-events:none;}

.callout{
  border-radius:12px; padding:16px 20px; font-size:14.5px; line-height:1.7; border:1px solid;
  display:flex; gap:12px; align-items:flex-start;
}
.callout .ic{font-size:20px; line-height:1;}
.callout.success{background:rgba(52,211,153,0.08); border-color:rgba(52,211,153,0.35); color:#c9f7e5;}
.callout.danger{background:rgba(255,107,107,0.08); border-color:rgba(255,107,107,0.35); color:#ffd6d6;}
.callout.info{background:rgba(79,140,255,0.08); border-color:rgba(79,140,255,0.35); color:#dbe7ff;}
.callout b{color:var(--accent-bright);}
.callout.danger b{color:#ffb3b3;}

.module-nav{display:grid; grid-template-columns:repeat(5,1fr); gap:14px;}
@media (max-width:980px){.module-nav{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.module-nav{grid-template-columns:1fr;}}
.module-card{
  background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:18px;
  cursor:pointer; transition:.2s ease; position:relative; overflow:hidden;
}
.module-card:hover{border-color:var(--accent); transform:translateY(-3px); box-shadow:0 8px 26px rgba(79,140,255,.18);}
.module-card .mi{font-size:24px; margin-bottom:10px; display:block;}
.module-card .mt{font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--text); margin-bottom:6px;}
.module-card .md{font-size:12px; color:var(--text-dim); line-height:1.5;}
.module-card .tag{position:absolute; top:12px; right:12px; font-size:10px; padding:2px 7px; border-radius:20px; background:rgba(245,185,66,.15); color:var(--gold); border:1px solid rgba(245,185,66,.4); font-family:var(--font-display);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; padding:10px 12px; color:var(--text-dim); font-weight:600; font-size:11.5px;
  letter-spacing:.4px; text-transform:uppercase; border-bottom:1px solid var(--border); white-space:nowrap;
}
td{padding:10px 12px; border-bottom:1px solid var(--border-soft); color:var(--text); white-space:nowrap;}
tbody tr:hover{background:rgba(79,140,255,0.05);}
.table-scroll{overflow-x:auto; border-radius:10px;}

.pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; letter-spacing:.2px;}
.pill.vip{background:rgba(255,107,107,.14); color:#ff9b9b; border:1px solid rgba(255,107,107,.35);}
.pill.stable{background:rgba(79,140,255,.14); color:#8fb4ff; border:1px solid rgba(79,140,255,.35);}
.pill.risk{background:rgba(245,185,66,.14); color:#ffcf7d; border:1px solid rgba(245,185,66,.35);}
.pill.sleep{background:rgba(138,147,171,.14); color:#b4bbd0; border:1px solid rgba(138,147,171,.35);}

.progress-bar{width:100px; height:8px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px;}
.progress-bar > span{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--gold),var(--red));}

.btn{
  appearance:none; border:1px solid var(--border); background:var(--panel2); color:var(--text);
  padding:9px 16px; border-radius:9px; font-family:var(--font-body); font-weight:500; font-size:13px;
  cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:.18s;
}
.btn:hover{border-color:var(--accent); color:var(--accent-bright); background:rgba(79,140,255,.08);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-bright)); color:#04070f; border:none; font-weight:700;}
.btn.primary:hover{filter:brightness(1.08); color:#04070f;}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
.field label{font-size:12.5px; color:var(--text-dim); font-weight:600;}
.field select, .field input[type=text]{
  background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:10px 12px; font-family:var(--font-body); font-size:14px; outline:none;
}
.field select:focus, .field input[type=text]:focus{border-color:var(--accent);}
input[type=range]{width:100%; accent-color:var(--accent);}

.chart-wrap{position:relative; height:380px;}
.chart-wrap.short{height:280px;}

.divider{height:1px; background:var(--border-soft); margin:22px 0;}

.badge-row{display:flex; gap:10px; flex-wrap:wrap;}
.info-chip{background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; min-width:100px;}
.info-chip .l{font-size:11px; color:var(--text-faint); margin-bottom:4px;}
.info-chip .v{font-family:var(--font-display); font-weight:700; font-size:17px;}

.rec-card{
  display:flex; align-items:center; gap:14px; background:var(--panel2); border:1px solid var(--border);
  border-radius:11px; padding:12px 16px; margin-bottom:10px;
}
.rec-rank{
  width:38px; height:38px; border-radius:9px; background:linear-gradient(135deg,var(--accent),var(--accent-bright));
  color:#04070f; font-family:var(--font-display); font-weight:700; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.rec-body .n{font-weight:700; font-size:15px;}
.rec-body .s{font-size:12px; color:var(--text-dim); margin-top:2px;}

.code-box{
  background:#080b16; border:1px solid var(--border); border-radius:10px; padding:14px 16px;
  font-family:var(--font-mono); font-size:12.5px; color:#bcd4ff; white-space:pre-wrap; line-height:1.7;
}

details{border:1px solid var(--border); border-radius:10px; padding:0; overflow:hidden; background:var(--panel2);}
details summary{padding:12px 16px; cursor:pointer; font-weight:600; font-size:13.5px; color:var(--text); list-style:none; display:flex; align-items:center; justify-content:space-between;}
details summary::-webkit-details-marker{display:none;}
details summary:after{content:'▾'; color:var(--text-faint); transition:.2s;}
details[open] summary:after{transform:rotate(180deg);}
details .details-body{padding:0 16px 16px;}

.scenario-card{border-radius:12px; padding:18px; border:1px solid;}
.scenario-card.opt{background:rgba(52,211,153,.08); border-color:rgba(52,211,153,.35);}
.scenario-card.mid{background:rgba(245,185,66,.08); border-color:rgba(245,185,66,.35);}
.scenario-card.bad{background:rgba(255,107,107,.08); border-color:rgba(255,107,107,.35);}
.scenario-card .st{font-size:12px; color:var(--text-dim); margin-bottom:8px;}
.scenario-card .sv{font-family:var(--font-display); font-weight:700; font-size:24px;}

.report h1{font-size:24px; font-weight:900; margin:0 0 4px;}
.report h3{font-size:15.5px; font-weight:700; margin:22px 0 8px; color:var(--accent-bright);}
.report ul{margin:6px 0; padding-left:20px; color:var(--text-dim); font-size:13.5px; line-height:1.9;}
.report ul b{color:var(--text);}
.quote{border-left:3px solid var(--accent); padding:10px 16px; margin:12px 0; background:rgba(79,140,255,.06); border-radius:0 8px 8px 0; font-size:14px;}

footer{position:relative; z-index:1; text-align:center; padding:26px 20px 40px; color:var(--text-faint); font-size:12px; border-top:1px solid var(--border-soft);}

.legend-row{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--text-dim);}
.legend-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px;}

.sub-hint{font-size:11.5px; color:var(--text-faint); margin-top:10px; line-height:1.7;}

::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:rgba(122,162,255,.25); border-radius:6px;}
</style>
</head>

/* ---------------- starfield background ---------------- */
(function starfield(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width*canvas.height)/9000);
    stars = Array.from({length:count},()=>({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*1.3+0.2,
      a:Math.random()*0.6+0.15,
      spd:Math.random()*0.15+0.02,
      tw:Math.random()*Math.PI*2,
    }));
  }
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const s of stars){
      s.tw += 0.02;
      const alpha = s.a * (0.6+0.4*Math.sin(s.tw));
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(180,205,255,${alpha})`;
      ctx.fill();
      s.y += s.spd;
      if(s.y > canvas.height){ s.y = 0; s.x = Math.random()*canvas.width; }
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', resize);
  resize();
  tick();
})();

/* ---------------- navigation ---------------- */
function goPage(page){
  document.querySelectorAll('section.page').forEach(s=>s.classList.remove('active'));
  const target = document.getElementById('page-'+page);
  if(target) target.classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.page === page);
  });
  document.getElementById('tabs').classList.remove('open');
  window.scrollTo({top:0, behavior:'smooth'});
  if(page==='m1' && !window.__m1Rendered){ renderM1(); window.__m1Rendered = true; }

/* ---------------- helpers ---------------- */
function fmt(n, d=0){ return Number(n).toLocaleString('zh-TW',{maximumFractionDigits:d, minimumFractionDigits:d}); }
function pct(n, d=1){ return (n*100).toFixed(d)+'%'; }
function downloadCSV(filename, rows, headers){
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>esc(r[h])).join(',')));
  const blob = new Blob(["\uFEFF"+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function downloadText(filename, text, mime='text/markdown'){
  const blob = new Blob(["\uFEFF"+text], {type:mime+';charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================
   MINI CANVAS CHART ENGINE（零外部依賴，純瀏覽器原生 Canvas）
   ============================================================ */
function debounce(fn, ms){
  let t;
  return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}
const CHART_FONT = "'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif";
const CHART_GRID = 'rgba(122,162,255,0.10)';
const CHART_AXIS_TEXT = '#9aa4c4';

function setupCanvas(canvas){
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(280, rect.width);
  const h = canvas.dataset.h ? Number(canvas.dataset.h) : Math.max(240, rect.height);
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function niceMax(v){
  if(v<=0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/p;
  let m;
  if(n<=1) m=1; else if(n<=2) m=2; else if(n<=5) m=5; else m=10;
  return m*p;
}

/* ---- scatter chart (M1) ---- */
function renderScatterChart(canvas, datasets, opts){
  const { ctx, w, h } = setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const padL=52, padR=18, padT=16, padB=42;
  const plotW = w-padL-padR, plotH = h-padT-padB;

  let allX=[], allY=[];
  datasets.forEach(ds=> ds.data.forEach(p=>{allX.push(p.x); allY.push(p.y);}));
  const xMin=0, xMax=niceMax(Math.max(...allX));
  const yMin=Math.floor(Math.min(...allY)*10)/10, yMax=Math.ceil(Math.max(...allY)*10)/10;
  const sx = x => padL + (x-xMin)/(xMax-xMin)*plotW;
  const sy = y => padT + plotH - (y-yMin)/(yMax-yMin)*plotH;

  // grid + axes
  ctx.strokeStyle = CHART_GRID; ctx.lineWidth=1; ctx.font = `11px ${CHART_FONT}`; ctx.fillStyle = CHART_AXIS_TEXT;
  const xTicks = 6, yTicks = 5;
  for(let i=0;i<=xTicks;i++){
    const xv = xMin + (xMax-xMin)*i/xTicks;
    const px = sx(xv);
    ctx.beginPath(); ctx.moveTo(px,padT); ctx.lineTo(px,padT+plotH); ctx.stroke();
    ctx.textAlign='center'; ctx.fillText(Math.round(xv), px, h-padB+18);
  }
  for(let i=0;i<=yTicks;i++){
    const yv = yMin + (yMax-yMin)*i/yTicks;
    const py = sy(yv);
    ctx.beginPath(); ctx.moveTo(padL,py); ctx.lineTo(padL+plotW,py); ctx.stroke();
    ctx.textAlign='right'; ctx.fillText(yv.toFixed(1), padL-10, py+4);
  }
  ctx.textAlign='center'; ctx.fillText(opts.xLabel||'', padL+plotW/2, h-6);
  ctx.save(); ctx.translate(14, padT+plotH/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.fillText(opts.yLabel||'',0,0); ctx.restore();

  // points
  datasets.forEach(ds=>{
    ctx.fillStyle = ds.color;
    ds.data.forEach(p=>{
      ctx.globalAlpha = 0.75;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 3, 0, Math.PI*2); ctx.fill();
    });
  });
  ctx.globalAlpha = 1;

  // hover tooltip
  const tip = canvas._tip || (canvas._tip = document.createElement('div'));
  tip.style.cssText = 'position:fixed;pointer-events:none;background:#0d1424;border:1px solid rgba(122,162,255,.35);border-radius:8px;padding:6px 10px;font-size:12px;color:#eef2ff;z-index:999;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4);';
  if(!tip.parentElement) document.body.appendChild(tip);
  canvas.onmousemove = (e)=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX-rect.left, my = e.clientY-rect.top;
    let best=null, bestD=14;
    datasets.forEach(ds=> ds.data.forEach(p=>{
      const dx = sx(p.x)-mx, dy = sy(p.y)-my;
      const d = Math.sqrt(dx*dx+dy*dy);
      if(d<bestD){ bestD=d; best=p; }
    }));
    if(best){
      const d = best.meta;

/* ---- bar chart (M2) ---- */
function renderBarChart(canvas, labels, values, opts){
  const { ctx, w, h } = setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const padL=36, padR=16, padT=14, padB=46;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const vMax = niceMax(Math.max(...values,1));

  ctx.strokeStyle = CHART_GRID; ctx.font = `11px ${CHART_FONT}`; ctx.fillStyle = CHART_AXIS_TEXT;
  const yTicks=4;
  for(let i=0;i<=yTicks;i++){
    const vv = vMax*i/yTicks;
    const py = padT+plotH-(vv/vMax)*plotH;
    ctx.beginPath(); ctx.moveTo(padL,py); ctx.lineTo(padL+plotW,py); ctx.stroke();
    ctx.textAlign='right'; ctx.fillText(Math.round(vv), padL-8, py+4);
  }

  const n = labels.length;
  const slot = plotW/n;
  const barW = Math.min(60, slot*0.55);
  values.forEach((v,i)=>{
    const bh = (v/vMax)*plotH;
    const bx = padL + slot*i + (slot-barW)/2;
    const by = padT+plotH-bh;
    const grad = ctx.createLinearGradient(0,by,0,padT+plotH);
    grad.addColorStop(0, (opts.color||'#f5b942'));
    grad.addColorStop(1, (opts.color2||'#f5b94288'));
    ctx.fillStyle = grad;
    ctx.beginPath();
    const r=6;
    ctx.moveTo(bx,by+r);
    ctx.arcTo(bx,by,bx+r,by,r);
    ctx.lineTo(bx+barW-r,by);
    ctx.arcTo(bx+barW,by,bx+barW,by+r,r);
    ctx.lineTo(bx+barW,padT+plotH);
    ctx.lineTo(bx,padT+plotH);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#eef2ff'; ctx.textAlign='center'; ctx.font=`600 12px ${CHART_FONT}`;
    ctx.fillText(v, bx+barW/2, by-8);

    ctx.fillStyle = CHART_AXIS_TEXT; ctx.font=`11px ${CHART_FONT}`;
    wrapLabel(ctx, String(labels[i]), bx+barW/2, padT+plotH+16, slot+10, 13);
  });
}
function wrapLabel(ctx, text, cx, y, maxW, lh){
  const chars = text.split('');
  let lines=[], cur='';
  chars.forEach(c=>{
    const test = cur+c;
    if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur=c; } else { cur = test; }
  });
  if(cur) lines.push(cur);
  lines = lines.slice(0,2);
  ctx.textAlign='center';
  lines.forEach((l,i)=> ctx.fillText(l, cx, y+i*lh));
}

/* ---- line + forecast band chart (M3) ---- */
function renderForecastChart(canvas, labels, historyData, lastQty, nextY, nextLo, nextHi){
  const { ctx, w, h } = setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const padL=54, padR=24, padT=20, padB=48;
  const plotW=w-padL-padR, plotH=h-padT-padB;

  const allVals = [...historyData.filter(v=>v!=null), nextHi, nextLo];
  const yMin = 0, yMax = niceMax(Math.max(...allVals));
  const n = labels.length;
  const sx = i => padL + (n<=1?0:(plotW*i/(n-1)));
  const sy = v => padT+plotH - (v-yMin)/(yMax-yMin)*plotH;

  ctx.strokeStyle = CHART_GRID; ctx.font = `11px ${CHART_FONT}`; ctx.fillStyle = CHART_AXIS_TEXT;
  const yTicks=5;
  for(let i=0;i<=yTicks;i++){
    const vv = yMax*i/yTicks;
    const py = sy(vv);
    ctx.beginPath(); ctx.moveTo(padL,py); ctx.lineTo(padL+plotW,py); ctx.stroke();
    ctx.textAlign='right'; ctx.fillText(Math.round(vv), padL-10, py+4);
  }
  // x labels (skip some if crowded)
  const step = Math.ceil(n/8);
  labels.forEach((l,i)=>{
    if(i%step!==0 && i!==n-1) return;
    ctx.textAlign='center'; ctx.fillText(l, sx(i), h-padB+18);
  });

  // confidence band at last point (vertical range bar)
  const lastX = sx(n-1);
  ctx.strokeStyle = '#f5b942'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(lastX, sy(nextLo)); ctx.lineTo(lastX, sy(nextHi)); ctx.stroke();
  [nextLo,nextHi].forEach(v=>{
    ctx.beginPath(); ctx.moveTo(lastX-5, sy(v)); ctx.lineTo(lastX+5, sy(v)); ctx.stroke();
  });

  // history line
  ctx.strokeStyle = '#4f8cff'; ctx.lineWidth=2.5; ctx.beginPath();
  let started=false;
  historyData.forEach((v,i)=>{
    if(v==null) return;
    const px=sx(i), py=sy(v);
    if(!started){ ctx.moveTo(px,py); started=true; } else { ctx.lineTo(px,py); }
  });
  ctx.stroke();
  ctx.fillStyle = '#4f8cff';
  historyData.forEach((v,i)=>{ if(v==null) return; ctx.beginPath(); ctx.arc(sx(i),sy(v),2.5,0,Math.PI*2); ctx.fill(); });

  // forecast dashed segment (last history point -> forecast point)
  ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth=2.5; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(sx(n-2), sy(lastQty)); ctx.lineTo(sx(n-1), sy(nextY)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath(); ctx.arc(sx(n-1), sy(nextY), 5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#05070d'; ctx.lineWidth=1.5; ctx.stroke();

  // legend
  ctx.font = `600 12px ${CHART_FONT}`;
  const legendY = 14;
  ctx.fillStyle='#4f8cff'; ctx.fillRect(padL, legendY-9, 12, 3);
  ctx.fillStyle='#c8d3f0'; ctx.textAlign='left'; ctx.fillText('歷史實績', padL+18, legendY-3);
  ctx.fillStyle='#ff6b6b'; ctx.fillRect(padL+90, legendY-9, 12, 3);
  ctx.fillStyle='#c8d3f0'; ctx.fillText('預測點估', padL+108, legendY-3);
  ctx.fillStyle='#f5b942'; ctx.fillRect(padL+180, legendY-9, 12, 3);
  ctx.fillStyle='#c8d3f0'; ctx.fillText('80% 信賴區間', padL+198, legendY-3);
}

/* ============================================================
   PAGE: M4 推薦引擎
   ============================================================ */
function recommendFor(cid, topN){
  const m4 = DATA.m4;
  const cust = m4.customers[cid];
  if(!cust) return null;
  const sortedRules = [...m4.rules].sort((a,b)=>b.lift-a.lift);
  const seen = new Set();
  const recs = [];
  for(const r of sortedRules){
    const pair = [r.antecedent, r.consequent].sort().join('|');
    if(seen.has(pair)) continue;
    seen.add(pair);
    recs.push({ sku:r.consequent, lift:r.lift, confidence:r.confidence, from_rule:`${r.antecedent} → ${r.consequent}` });
    if(recs.length>=topN) break;
  }
  return { customer_id:cid, cluster:cust.cluster_name, cust, recommendations:recs,
    explain:`基於「${cust.cluster_name}」群 + Apriori Top ${topN} 規則（Lift 排序）` };
}
function clusterActionText(cluster){
  if(cluster.includes('VIP')) return 'VIP 限定！';
  if(cluster.includes('沉睡')) return '好久不見！';
  if(cluster.includes('流失')) return '搶救！別走！';
  if(cluster.includes('穩定')) return '新品到貨！';
  return '嗨！';
}
function buildLineTemplate(result){
  const prefix = clusterActionText(result.cluster);
  const skusStr = result.recommendations.map(r=>r.sku).join('、');
  if(result.cluster.includes('VIP')) return `${prefix}本月 VIP 限定 → ${skusStr} 套組 88 折！出示券碼即享尊榮配送。#物流好夥伴`;
  if(result.cluster.includes('沉睡')) return `${prefix}${skusStr} 任選 2 件 88 折，限本週回娘家補貨，免運門檻打 5 折！#物流好夥伴`;
  if(result.cluster.includes('流失')) return `${prefix}最近沒看到您下單？${skusStr} 任一件折 200，客服可協助補貨評估。#物流好夥伴`;
  return `${prefix}${skusStr} 配套販售，本週 9 折！加入 LINE OA 即享。#物流好夥伴`;
}
